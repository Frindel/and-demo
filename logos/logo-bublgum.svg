<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ===== Логотип «Бубль гум» IT-школа (v3 — чистый, уверенный) ===== -->

  <!-- Квадрат-носитель -->
  <rect width="512" height="512" rx="32" fill="#000000"/>

  <!-- Залитый белый диск -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF"/>

  <!-- Левая скобка < — чистый шеврон -->
  <polyline points="218,168 132,256 218,344"
            stroke="#000000" stroke-width="32"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Правая скобка > — чистый шеврон -->
  <polyline points="294,168 380,256 294,344"
            stroke="#000000" stroke-width="32"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Точка-акцент по центру (вместо слэша, чтобы не путать) -->
  <circle cx="256" cy="256" r="18" fill="#000000"/>

  <!-- Верхний блик-пузырь — часть окружности, интегрирован -->
  <path d="M 256 76 A 180 180 0 0 1 436 256"
        stroke="#000000" stroke-width="6"
        stroke-linecap="round" fill="none" opacity="0.25"/>
</svg>
